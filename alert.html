<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d5c">
<title>未完成巡查</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* ---------- 統計卡片 ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  @media (min-width:760px){.kpi-row{grid-template-columns:repeat(4,1fr)}}
  .kpi{
    background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:14px 15px;box-shadow:var(--shadow);
  }
  .kpi .k{font-size:12px;color:var(--ink-3);margin-bottom:5px;font-weight:600}
  .kpi .v{
    font-size:30px;font-weight:800;line-height:1.05;color:var(--primary);
    font-variant-numeric:tabular-nums;
  }
  .kpi .v small{font-size:14px;font-weight:600;color:var(--ink-3)}
  .kpi.miss .v{color:var(--err)}
  .kpi.done .v{color:var(--ok)}
  .kpi.rate .v{color:var(--accent-2)}

  .rate-bar{
    height:12px;border-radius:6px;background:#e6ecf1;overflow:hidden;margin-top:12px;
  }
  .rate-bar > i{
    display:block;height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--ok),#22c55e);
    transition:width .4s ease;
  }
  .rate-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:7px}

  /* ---------- 工具列 ---------- */
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .spacer{flex:1}
  .seg{display:inline-flex;background:#eef2f5;border-radius:10px;padding:3px;gap:2px}
  .seg button{
    border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;
    color:var(--ink-2);padding:9px 15px;border-radius:8px;cursor:pointer;min-height:40px;
  }
  .seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(16,35,46,.14)}

  /* ---------- 主表格 ---------- */
  .matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
  table.matrix{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
  table.matrix th,table.matrix td{
    padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  table.matrix th{
    background:#f7fafc;font-size:12px;color:var(--ink-3);font-weight:700;
    letter-spacing:.04em;position:sticky;top:0;z-index:2;
  }
  table.matrix th.pt,table.matrix td.pt{text-align:center;min-width:88px}
  table.matrix tbody tr:last-child td{border-bottom:none}
  table.matrix tbody tr:hover{background:#fafcfd}
  table.matrix td.nm{font-weight:700}
  table.matrix td.sh{font-size:13px;color:var(--ink-2)}

  .cell-ok{
    display:inline-flex;align-items:center;gap:4px;justify-content:center;
    background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:13px;
    padding:5px 9px;border-radius:8px;font-variant-numeric:tabular-nums;
  }
  .cell-miss{
    display:inline-flex;align-items:center;gap:4px;justify-content:center;
    background:var(--err-bg);color:var(--err);font-weight:700;font-size:13px;
    padding:5px 9px;border-radius:8px;
  }
  .cell-na{
    display:inline-flex;align-items:center;justify-content:center;
    background:#f1f4f7;color:var(--ink-3);font-weight:600;font-size:12px;
    padding:5px 9px;border-radius:8px;
  }
  .pct-pill{
    display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .pct-pill.full{background:var(--ok-bg);color:var(--ok)}
  .pct-pill.part{background:var(--warn-bg);color:var(--warn)}
  .pct-pill.zero{background:var(--err-bg);color:var(--err)}

  .shift-head{
    background:#eef4f8 !important;color:var(--primary) !important;
    font-size:12px;letter-spacing:.1em;
  }
  .shift-head .tag{
    display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:#fff;color:var(--ink-3);margin-left:8px;letter-spacing:0;
  }
  .shift-head .tag.live{background:var(--ok-bg);color:var(--ok)}
  .shift-head .tag.wait{background:#e6ecf1;color:var(--ink-3)}

  /* ---------- 未完成清單 ---------- */
  .miss-list{display:flex;flex-direction:column;gap:8px}
  .miss-item{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    border:1px solid var(--line);border-left:4px solid var(--err);
    border-radius:10px;padding:11px 13px;background:#fff;
  }
  .miss-item .who{font-weight:800;font-size:15px}
  .miss-item .where{font-size:13px;color:var(--ink-2)}
  .miss-item .sh-tag{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:#eef4f8;color:var(--primary-2);
  }
  .miss-item .pt-tag{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:var(--err-bg);color:var(--err);
  }
  .miss-item .spacer{flex:1}

  /* ---------- 手機：卡片式 ---------- */
  .cards{display:none;flex-direction:column;gap:10px}
  .pcard{
    background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:13px 14px;box-shadow:0 1px 2px rgba(16,35,46,.05);
  }
  .pcard .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .pcard .hd .nm{font-weight:800;font-size:16px;flex:1}
  .pcard .hd .sh-tag{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:#eef4f8;color:var(--primary-2);
  }
  .pcard .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pcard .box{
    border:1px solid var(--line);border-radius:10px;padding:9px 10px;
    display:flex;flex-direction:column;gap:3px;
  }
  .pcard .box .pt{font-size:11px;color:var(--ink-3);font-weight:700}
  .pcard .box.ok{background:var(--ok-bg);border-color:#bfe6cd}
  .pcard .box.ok .pt{color:var(--ok)}
  .pcard .box.miss{background:var(--err-bg);border-color:#f3c9c9}
  .pcard .box.miss .pt{color:var(--err)}
  .pcard .box .st{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
  .pcard .box.ok .st{color:var(--ok)}
  .pcard .box.miss .st{color:var(--err)}
  .pcard .box.na{background:#f1f4f7}
  .pcard .box.na .st{color:var(--ink-3);font-size:12px}
  .pcard .ft{margin-top:9px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between}

  @media (max-width:700px){
    .matrix-wrap{display:none}
    .cards{display:flex}
    .kpi .v{font-size:25px}
    .kpi{padding:12px 13px}
  }

  .live-dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);
    margin-right:5px;vertical-align:middle;animation:pulse 1.8s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>

<header class="topbar">
  <div class="org" id="orgName">廠務部</div>
  <h1>⚠️ 未完成巡查</h1>
  <div class="sub" id="subLine">—</div>
</header>

<main class="wrap wide">

  <!-- 統計 -->
  <div class="kpi-row" id="kpiRow"></div>

  <section class="card">
    <div class="card-title">完成率</div>
    <div class="rate-bar"><i id="rateFill" style="width:0%"></i></div>
    <div class="rate-meta">
      <span id="rateLeft">—</span>
      <span id="rateRight">—</span>
    </div>
  </section>

  <!-- 篩選 -->
  <section class="card">
    <div class="card-title">篩選</div>
    <div class="toolbar" style="margin-bottom:0">
      <div class="seg" id="shiftSeg">
        <button type="button" data-shift="all" class="on">全部</button>
        <button type="button" data-shift="早班">早班</button>
        <button type="button" data-shift="晚班">晚班</button>
      </div>
      <input class="input" type="date" id="fDate" style="width:auto;min-height:44px;padding:8px 12px;font-size:14px">
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="refreshBtn" type="button">↻ 重新整理</button>
      <button class="btn btn-accent btn-sm" id="csvBtn" type="button">⬇ 匯出未完成</button>
    </div>
    <div class="note info" style="margin-top:12px">
      <span class="ico">ℹ️</span>
      <span id="sourceNote">—</span>
    </div>
  </section>

  <!-- 主表格（桌機） -->
  <section class="card">
    <div class="card-title">每人巡查狀態 <span id="countBadge" class="badge" style="margin-left:auto">—</span></div>
    <div class="matrix-wrap">
      <table class="matrix" id="matrixTable">
        <thead id="matrixHead"></thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="cards" id="cardsBox"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="big">✅</div>
      <div>這個條件下沒有資料</div>
    </div>
  </section>

  <!-- 未完成清單 -->
  <section class="card">
    <div class="card-title">未完成清單 <span id="missBadge" class="badge err" style="margin-left:auto">0 項</span></div>
    <div class="miss-list" id="missList"></div>
    <div class="empty-state" id="missEmpty" style="display:none">
      <div class="big">🎉</div>
      <div>全部巡查點都完成了</div>
    </div>
  </section>

  <div class="foot">
    <a href="index.html">← 回到簽到頁</a> · <a href="records.html">簽到記錄</a> · <a href="qr.html">QR Code 產生器</a>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="assets/store.js"></script>
<script>
(function () {
  "use strict";
  var CFG = window.CHECKIN_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };

  document.title = "未完成巡查 · " + (CFG.siteTitle || "巡查簽到");
  $("orgName").textContent = CFG.orgName || "";
  if (!CFG.orgName) $("orgName").style.display = "none";

  var ALERT_CFG = CFG.alert || {};
  var AUTO_SEC = Number(ALERT_CFG.autoRefreshSeconds != null ? ALERT_CFG.autoRefreshSeconds : 60);
  var COUNT_NOT_STARTED = !!ALERT_CFG.countNotStarted;

  var shiftFilter = "all";
  var autoTimer = null;
  var lastRefresh = null;

  function toast(msg, kind) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.className = "toast"; }, 2400);
  }

  /* ---------- 班別切換鈕文字 ---------- */
  (function () {
    var labels = QC.shiftLabels();
    var btns = $("shiftSeg").querySelectorAll("button");
    btns[1].dataset.shift = labels[0];
    btns[1].textContent = labels[0];
    btns[2].dataset.shift = labels[1];
    btns[2].textContent = labels[1];
  })();

  /* ---------- 日期預設今天 ---------- */
  $("fDate").value = QC.fmtDate(new Date());

  /* ---------- 渲染 ---------- */
  function render() {
    var dateStr = $("fDate").value || QC.fmtDate(new Date());
    var m = QC.buildMatrix({
      date: dateStr,
      shiftFilter: shiftFilter,
      countNotStarted: COUNT_NOT_STARTED
    });

    renderKpi(m);
    renderMatrix(m);
    renderMissing(m);

    lastRefresh = new Date();
    updateSubLine(m);
  }

  function renderKpi(m) {
    var t = m.totals;
    var html = "";
    html += '<div class="kpi"><div class="k">應巡查總數</div><div class="v">' + t.expected + '</div></div>';
    html += '<div class="kpi done"><div class="k">已完成</div><div class="v">' + t.done + '</div></div>';
    html += '<div class="kpi miss"><div class="k">未完成</div><div class="v">' + t.missing + '</div></div>';
    html += '<div class="kpi rate"><div class="k">完成率</div><div class="v">' + t.rate + '<small>%</small></div></div>';
    $("kpiRow").innerHTML = html;

    $("rateFill").style.width = t.rate + "%";
    $("rateLeft").textContent = "已完成 " + t.done + " / " + t.expected + " 項";
    $("rateRight").textContent = t.missing ? "尚缺 " + t.missing + " 項" : "全部完成";
  }

  function renderMatrix(m) {
    var pts = m.points;
    var head = $("matrixHead");
    var body = $("matrixBody");
    var cards = $("cardsBox");

    head.innerHTML = "";
    body.innerHTML = "";
    cards.innerHTML = "";

    var hasRows = false;

    m.shifts.forEach(function (s) {
      if (!s.rows.length) return;
      hasRows = true;

      /* ---- 桌機表頭 ---- */
      var trh = document.createElement("tr");
      var th = document.createElement("th");
      th.colSpan = 2 + pts.length + 1;
      th.className = "shift-head";
      th.innerHTML = s.label +
        '<span class="tag ' + (s.started ? "live" : "wait") + '">' +
        (s.started ? "進行中" : "尚未開始") + '</span>' +
        '<span class="tag">' + s.done + ' / ' + s.expected + '</span>';
      trh.appendChild(th);
      head.appendChild(trh);

      var trh2 = document.createElement("tr");
      trh2.innerHTML = '<th>姓名</th><th>班別</th>' +
        pts.map(function (p) { return '<th class="pt">' + p.code + '</th>'; }).join("") +
        '<th class="pt">完成度</th>';
      head.appendChild(trh2);

      /* ---- 桌機列 ---- */
      s.rows.forEach(function (row) {
        var tr = document.createElement("tr");
        var tds = "";
        tds += '<td class="nm"></td><td class="sh"></td>';
        pts.forEach(function (p) {
          var c = row.cells[p.code];
          if (!s.started && !COUNT_NOT_STARTED) {
            tds += '<td class="pt"><span class="cell-na">—</span></td>';
          } else if (c && c.done) {
            tds += '<td class="pt"><span class="cell-ok">✓ ' + String(c.time || "").slice(0, 5) + '</span></td>';
          } else {
            tds += '<td class="pt"><span class="cell-miss">未完成</span></td>';
          }
        });
        var pct = Math.round(row.done / row.total * 100);
        var cls = pct === 100 ? "full" : (pct === 0 ? "zero" : "part");
        tds += '<td class="pt"><span class="pct-pill ' + cls + '">' + row.done + '/' + row.total + '</span></td>';
        tr.innerHTML = tds;
        tr.querySelector("td.nm").textContent = row.name;
        tr.querySelector("td.sh").textContent = s.label;
        body.appendChild(tr);

        /* ---- 手機卡片 ---- */
        var card = document.createElement("div");
        card.className = "pcard";
        var boxes = pts.map(function (p) {
          var c = row.cells[p.code];
          if (!s.started && !COUNT_NOT_STARTED) {
            return '<div class="box na"><span class="pt">' + p.code + ' ' + p.name +
                   '</span><span class="st">尚未開始</span></div>';
          }
          if (c && c.done) {
            return '<div class="box ok"><span class="pt">' + p.code + ' ' + p.name +
                   '</span><span class="st">✓ ' + String(c.time || "").slice(0, 5) + '</span></div>';
          }
          return '<div class="box miss"><span class="pt">' + p.code + ' ' + p.name +
                 '</span><span class="st">未完成</span></div>';
        }).join("");
        card.innerHTML =
          '<div class="hd"><span class="nm"></span><span class="sh-tag">' + s.label + '</span></div>' +
          '<div class="grid2">' + boxes + '</div>' +
          '<div class="ft"><span>' + (s.started ? "進行中" : "尚未開始") + '</span>' +
          '<span>' + row.done + ' / ' + row.total + ' 點</span></div>';
        card.querySelector(".hd .nm").textContent = row.name;
        cards.appendChild(card);
      });
    });

    $("emptyState").style.display = hasRows ? "none" : "block";
    $("countBadge").textContent = m.totals.expected
      ? (m.totals.done + " / " + m.totals.expected + " 項")
      : "無資料";
  }

  function renderMissing(m) {
    var list = QC.buildMissingList(m);
    var box = $("missList");
    box.innerHTML = "";
    $("missBadge").textContent = list.length + " 項";
    $("missEmpty").style.display = list.length ? "none" : "block";

    list.forEach(function (x) {
      var el = document.createElement("div");
      el.className = "miss-item";
      el.innerHTML =
        '<span class="who"></span>' +
        '<span class="sh-tag">' + x.shift + '</span>' +
        '<span class="pt-tag">' + x.point + '</span>' +
        '<span class="where"></span>';
      el.querySelector(".who").textContent = x.name;
      el.querySelector(".where").textContent = x.pointName + " 尚未簽到";
      box.appendChild(el);
    });
  }

  function updateSubLine(m) {
    var src = QC.useSheet()
      ? "資料來源：本機備份 + Google 試算表"
      : "資料來源：這支手機的瀏覽器（本機模式）";
    var t = lastRefresh ? QC.fmtTime(lastRefresh) : "—";
    var auto = AUTO_SEC > 0 ? " · 每 " + AUTO_SEC + " 秒自動更新" : "";
    $("subLine").textContent = m.date + " · 更新於 " + t + auto;
    $("sourceNote").textContent = src +
      (QC.useSheet() ? "" : "。本機模式只看得到這支手機簽的資料，要全員總覽請接 Google 試算表。");
  }

  /* ---------- 事件 ---------- */
  $("shiftSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) {
      x.classList.toggle("on", x === b);
    });
    shiftFilter = b.dataset.shift;
    render();
  });

  $("fDate").addEventListener("change", render);

  $("refreshBtn").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    var done = function () {
      btn.disabled = false;
      render();
      toast("已更新", "ok");
    };
    if (QC.useSheet() && navigator.onLine) {
      QC.flushQueue().then(done).catch(done);
    } else {
      done();
    }
  });

  $("csvBtn").addEventListener("click", function () {
    var m = QC.buildMatrix({
      date: $("fDate").value || QC.fmtDate(new Date()),
      shiftFilter: shiftFilter,
      countNotStarted: COUNT_NOT_STARTED
    });
    var list = QC.buildMissingList(m);
    if (!list.length) { toast("目前沒有未完成項目", "err"); return; }
    var rows = list.map(function (x) {
      return {
        ts: m.date, date: m.date, time: "", point: x.point, pointName: x.pointName,
        shift: x.shift, name: x.name, remark: "未完成", device: "", synced: true
      };
    });
    QC.downloadCSV("missing-" + m.date + ".csv", rows);
    toast("已匯出 " + rows.length + " 項", "ok");
  });

  /* ---------- 自動更新 ---------- */
  function startAuto() {
    clearInterval(autoTimer);
    if (AUTO_SEC <= 0) return;
    autoTimer = setInterval(function () {
      if (document.hidden) return;
      if (QC.useSheet() && navigator.onLine) {
        QC.flushQueue().then(render).catch(render);
      } else {
        render();
      }
    }, AUTO_SEC * 1000);
  }

  /* ---------- 啟動 ---------- */
  render();
  startAuto();

  if (QC.useSheet() && navigator.onLine) {
    QC.flushQueue().then(render).catch(render);
  }
})();
</script>
</body>
</html>
